<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edge Security Page</title>
<style>
:root{
--bg:#0f172a;--card:rgba(255,255,255,.08);--text:#fff;--muted:#cbd5e1;
--accent:#f38020;--border:rgba(255,255,255,.12)
}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);
background:linear-gradient(135deg,#0f172a,#1e293b,#111827);min-height:100vh;
display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:980px;width:100%;background:var(--card);backdrop-filter:blur(20px);
border:1px solid var(--border);border-radius:24px;padding:40px;box-sizing:border-box}
.logo{color:var(--accent);font-weight:700;font-size:28px}
.code{font-size:88px;font-weight:800;margin:10px 0}
.sub{color:var(--accent);font-weight:600}
.desc{color:var(--muted);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:24px}
.box{background:rgba(255,255,255,.05);padding:14px;border-radius:14px}
.label{font-size:12px;color:#94a3b8;text-transform:uppercase}
.value{margin-top:6px}
.challenge{margin-top:24px;padding:18px;background:rgba(255,255,255,.05);border-radius:14px}
button{background:var(--accent);border:0;color:white;padding:12px 20px;border-radius:12px;cursor:pointer}
.timer{font-size:28px;font-weight:700;color:var(--accent)}
.footer{margin-top:25px;color:#94a3b8;font-size:13px}
</style>
</head>
<body>
<div class="card">
<div class="logo">Edge Protection</div>
<div class="sub" id="subtitle"></div>
<div class="code" id="status"></div>
<h1 id="title"></h1>
<p class="desc" id="desc"></p>

<div id="special"></div>

<div class="grid">
<div class="box"><div class="label">Ray ID</div><div class="value" id="ray"></div></div>
<div class="box"><div class="label">Client IP</div><div class="value">203.0.113.10</div></div>
<div class="box"><div class="label">Country</div><div class="value">KR</div></div>
<div class="box"><div class="label">Timestamp</div><div class="value" id="ts"></div></div>
</div>

<div class="footer">Custom security page • Cloudflare-inspired design</div>
</div>

<script>
const pages={
waf:["403","WAF Block","Access Denied","Your request was blocked by a Web Application Firewall rule."],
ipblock:["403","IP/Country Block","Access Restricted","Access from your IP address or region is restricted."],
ipchallenge:["403","IP/Country Challenge","Verification Required","Additional verification is required before access is granted."],
interactive:["403","Interactive Challenge","Human Verification","Please verify that you are a human visitor."],
managed:["403","Managed Challenge","Checking Your Browser","Your browser is being checked before access is granted."],
jschallenge:["403","Non‑Interactive Challenge","Security Check","Automatic browser verification is in progress."],
ratelimit:["429","Rate Limit","Too Many Requests","You have exceeded the allowed request rate."],
e500:["500","500 Class Error","Server Error","The origin server failed to process the request."],
e1000:["1000","1000 Class Error","Configuration Error","A DNS or configuration issue prevented completion of the request."]
};

const p=new URLSearchParams(location.search);
const mode=p.get("mode")||"managed";
const d=pages[mode]||pages.managed;

status.textContent=d[0];
subtitle.textContent=d[1];
title.textContent=d[2];
desc.textContent=d[3];

ray.textContent=Math.random().toString(16).slice(2)+Math.random().toString(16).slice(2);
ts.textContent=new Date().toUTCString();

if(mode==="managed"){
special.innerHTML=`<div class="challenge">
<p>This process is automatic. Estimated wait time:</p>
<div class="timer" id="timer">5</div>
</div>`;
let s=5;
setInterval(()=>{
s--;
const t=document.getElementById('timer');
if(t)t.textContent=s;
if(s<=0) location.reload();
},1000);
}

if(mode==="interactive"){
special.innerHTML=`<div class="challenge">
<p><input type="checkbox" id="v"> <label for="v">Verify that you are human</label></p>
<button onclick="alert('Verification successful')">Continue</button>
</div>`;
}

if(mode==="jschallenge"){
special.innerHTML=`<div class="challenge">
Automatic browser verification is running...
</div>`;
}

if(mode==="e1000"){
const ec=p.get("code")||"1020";
desc.textContent="Cloud configuration error code: "+ec;
}
</script>
</body>
</html>
